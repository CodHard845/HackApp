name: Build iOS App

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Create Basic App Structure
        run: |
          mkdir -p Payload/HackerApp.app
          cat << 'EOF' > Payload/HackerApp.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.mohammed.hackerapp</string>
              <key>CFBundleName</key>
              <string>HackerApp</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Compile Swift File
        run: |
          swiftc -target arm64-apple-ios15.0 -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
                 -parse-as-library HackerApp/HackerApp/HackerAppApp.swift \
                 HackerApp/HackerApp/ContentView.swift \
                 -o Payload/HackerApp/HackerApp

      - name: Package IPA
        run: |
          zip -r HackerApp.ipa Payload/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HackerApp-IPA
          path: HackerApp.ipa
